name: "Experiment: Ontolo-CI"

on:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: false

jobs:
  ontolo-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SHACL dependencies
        run: |
          pip install pyshacl rdflib

      - name: Run SHACL validation and build LLM request
        working-directory: fsl-research/ontolo-ci/python_scripts
        env:
          GPT_MODEL: ${{ vars.GPT_MODEL || 'gpt-4.1-nano' }}
        run: |
          python run_validation.py

      - name: Prepare batch request artifact
        run: |
          mkdir -p batch-requests-ontolo-ci

          if compgen -G "fsl-research/ontolo-ci/llm_prompting/batches/*.jsonl" > /dev/null; then
            cp fsl-research/ontolo-ci/llm_prompting/batches/*.jsonl \
               batch-requests-ontolo-ci/
          else
            echo "No SHACL violations; no batch requests generated."
          fi

      - name: Upload SHACL batch requests
        uses: actions/upload-artifact@v4
        with:
          name: batch-requests-ontolo-ci
          path: batch-requests-ontolo-ci/
          if-no-files-found: warn
