name: FSL Research Pipeline - CI/CD

on:
  push:
  workflow_dispatch:

jobs:
  saref-experiment:
    uses: ./.github/workflows/experiment-saref.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  ontoology:
    uses: ./.github/workflows/experiment-ontoology.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  ontolo-ci:
    uses: ./.github/workflows/experiment-ontolo-ci.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  open-combined-pr:
    needs: [saref-experiment, ontoology, ontolo-ci]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync local main with origin
        run: |
          if [ "$(git branch --show-current)" != "main" ]; then
            git fetch origin main:main
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download all experiment outputs
        uses: actions/download-artifact@v4
        with:
          pattern: experiment-output-*
          path: artifacts
          merge-multiple: false

      - name: Combine into one PR (one commit per experiment)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python fsl-research/common/open_pr.py combine \
            --manifests-dir artifacts \
            --repo-root . \
            --branch "research/combined-update-${{ github.run_id }}" \
            --push --create-pr
