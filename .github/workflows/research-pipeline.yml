name: FSL Research Pipeline - CI/CD

# Build (this workflow, per experiment, parallel) writes each experiment's
# LLM request file(s) and submits them as one OpenAI batch job each -- no
# polling here. A separate scheduled workflow (research-retrieval-dispatch.yml)
# polls every batch to completion and, once an experiment's batches are all
# done, runs that experiment's post-processing and lands it on the shared
# combined PR. See fsl-research/common/pipeline_state.py for how state
# survives between this push-triggered run and that later cron-triggered one.

on:
  push:
  workflow_dispatch:

jobs:
  saref-experiment:
    uses: ./.github/workflows/experiment-saref.yml

  ontoology:
    uses: ./.github/workflows/experiment-ontoology.yml

  ontolo-ci:
    uses: ./.github/workflows/experiment-ontolo-ci.yml

  submit:
    needs: [saref-experiment, ontoology, ontolo-ci]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install openai jsonschema

      - name: Download all batch requests
        uses: actions/download-artifact@v4
        with:
          pattern: batch-requests-*
          path: artifacts
          merge-multiple: false

      - name: Submit one batch job per request file
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python fsl-research/common/submit_batches.py \
            --input-dir artifacts \
            --repo-root . \
            --run-id "${{ github.run_id }}"
